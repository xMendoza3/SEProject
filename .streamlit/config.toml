# حجم الخط الأساسي للتطبيق كله. الافتراضي ١٦، وكبّرناه درجة عشان القراءة تريح.
# كل الأحجام في التنسيق نسبية لهذا الرقم، فتكبر وتصغر كلها معه بنفس النسبة.
# الوضع الفاتح والداكن تحت ياخذونه من هنا تلقائياً.
[theme]
baseFontSize = 17

# اللون الأساسي للأزرار والاختيارات: رمادي حبري هادئ،
# عشان تبقى ألوان المذاهب الأربعة هي الألوان الوحيدة اللي تلفت النظر.
# لون للوضع الفاتح ولون للوضع الداكن، والتطبيق يتبع إعداد جهازك.
[theme.light]
primaryColor = "#334155"
# خلفية بلون الورق القديم بدل الأبيض الصافي، تناسب الزخارف وتريح العين.
# والثانية للشريط الجانبي والحقول، أغمق منها بدرجة.
backgroundColor = "#fcfaf5"
secondaryBackgroundColor = "#f4efe4"

[theme.dark]
primaryColor = "#cbd5e1"

# نسمح للتطبيق يقدّم الملفات اللي في مجلد الملفات الثابتة، مثل أيقونة التطبيق،
# عشان الجوال يلقاها لما تضيف التطبيق للشاشة الرئيسية.
[server]
enableStaticServing = true
